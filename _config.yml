title: Communication Theory in the Age of AI
tagline: Making the commonplace visible through communication theory
description: >-
  A public-facing guide to major schools of communication theory and how they
  help explain communication problems in the 21st century, especially when
  artificial intelligence is involved.

url: "https://bryngrant.github.io"
baseurl: "/MyAwesomeSemester"

author: Bryn Grant
email: ""

github_username: bryngrant
repository_name: MyAwesomeSemester

markdown: kramdown
kramdown:
  input: GFM

permalink: pretty

defaults:
  - scope:
      path: ""
    values:
      layout: default

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
